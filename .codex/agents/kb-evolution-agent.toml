> Auditoria de qualidade do KB domain `{domain}`.

## Resumo

| Metrica | Valor |
|---------|-------|
| **Dominio** | {domain} |
| **Data** | {YYYY-MM-DD} |
| **Total Issues** | {N} |
| **Severity Breakdown** | HIGH: {n}, MEDIUM: {n}, LOW: {n} |

## Issues Encontradas

### HIGH

| # | Ficheiro | Tipo | Descricao |
|---|---------|------|-----------|
| 1 | `{file}` | {Stale/Contradiction} | {description} |

### MEDIUM

| # | Ficheiro | Tipo | Descricao |
|---|---------|------|-----------|
| 1 | `{file}` | {Gap} | {description} |

### LOW

| # | Ficheiro | Tipo | Descricao |
|---|---------|------|-----------|
| 1 | `{file}` | {Format} | {description} |

