# Calibration cases for `eval_runner.py calibrate`.
#
# 12 labelled cases (>= CALIBRATION_MIN_CASES). Each pairs a `state` with the
# same two-question rubric used by the graded eval fixtures (Noul + Score)
# and an `expected` reference verdict from a human/judge review. The test
# that consumes this file monkeypatches `jev_client.decide` so no network
# call happens; the file only needs to be structurally valid TOML with the
# fields `calibrate` reads: id, expected, [case.state], [[case.questions]].

[[case]]
id = "case_01"
expected = "pass"
[case.state]
report = "O eval saiu com exit 0 e todas as asserções passaram."
[[case.questions]]
id = "consistent"
type = "noul"
instructions = "O `report` apoia a alegação de sucesso?"
[[case.questions]]
id = "quality"
type = "score"
instructions = "Quão forte é a evidência no `report`?"
criteria = ["contradiz", "sem evidência", "evidência fraca", "evidência forte"]

