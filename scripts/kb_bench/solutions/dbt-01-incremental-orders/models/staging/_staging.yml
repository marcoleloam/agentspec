models:
  - name: stg_orders
    description: One row per order change exported by the order service (rolling 3-day window).
    columns:
      - name: order_id
        data_tests:
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'returned']
